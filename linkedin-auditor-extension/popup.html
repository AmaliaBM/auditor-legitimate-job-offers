<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; font-size: 13px; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    #estado { color: #555; }
    #resultado { display: none; }
    #score { font-size: 28px; font-weight: bold; }
    .bar { height: 8px; background: #e5e5e5; border-radius: 4px; margin: 8px 0 12px; overflow: hidden; }
    #barra { height: 100%; width: 0; }
    .ok { color: #1e7e34; }
    .riesgo { color: #bd2130; }
    ul { padding-left: 18px; margin: 0; }
    li { margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>🛡️ Auditor de Vacantes</h1>
  <div id="estado">Analizando oferta…</div>
  <div id="resultado">
    <div id="empresa" style="color:#555; margin-bottom:6px;"></div>
    <div>Riesgo estimado: <span id="score"></span></div>
    <div class="bar"><div id="barra"></div></div>
    <ul id="alertas"></ul>
  </div>
  <script src="popup.js"></script>
</body>
</html>
